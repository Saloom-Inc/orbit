name: Thumbnails and build

on:
  push:
    branches: [main]
    paths:
      - "data/library.txt"
      - "src/**"
      - "scripts/**"
      - "build.py"
      - ".github/workflows/thumbnails.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thumbnails
  cancel-in-progress: false

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Fetch missing thumbnails
        env:
          ONSHAPE_ACCESS_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
          ONSHAPE_SECRET_KEY: ${{ secrets.ONSHAPE_SECRET_KEY }}
        run: python scripts/fetch_thumbs.py
      - name: Rebuild index.html
        run: python build.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs index.html
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Update thumbnails and rebuild site [skip ci]"
          git push
